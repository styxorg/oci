name: oci
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  prov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Write OCI config
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_B64 }}" | base64 -d > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\ntenancy=%s\nfingerprint=%s\nkey_file=%s\nregion=%s\n' \
            "${{ secrets.OCI_USER }}" \
            "${{ secrets.OCI_TENANCY }}" \
            "${{ secrets.OCI_FINGERPRINT }}" \
            "$HOME/.oci/key.pem" \
            "${{ secrets.OCI_REGION }}" > ~/.oci/config
          chmod 600 ~/.oci/config

      - name: prov
        env:
          OCI_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT }}
          OCI_AD: ${{ secrets.OCI_AD }}
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
        run: bash provision.sh
